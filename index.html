<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Taloryn Labs — sito in costruzione</title>
<meta name="description" content="Il sito di Taloryn Labs è in costruzione.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/icona-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Montserrat";font-weight:400;font-display:swap;src:url("/font/montserrat-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;font-display:swap;src:url("/font/montserrat-latin-700-normal.woff2") format("woff2")}
:root{--nero:#0B0D10;--oro:#D4AF37;--oro-chiaro:#F2D37A;--testo:#F4F4F1;--testo-2:#C9C9C4;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#1a160b 0%,var(--nero) 60%);color:var(--testo);font-family:Montserrat,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 16px;text-align:center;line-height:1.6}
main{max-width:560px}
img{width:min(220px,55vw);height:auto;display:block;margin:0 auto 28px}
.occhiello{color:var(--oro);font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
h1{font-size:clamp(28px,6vw,44px);line-height:1.15;margin:12px 0 18px}
p{color:var(--testo-2);font-size:17px}
a{color:var(--oro-chiaro);text-underline-offset:3px}
.riga{width:64px;height:1px;background:var(--oro);margin:28px auto}
small{display:block;color:#8d8d88;font-size:13px}
</style>
</head>
<body>
<main>
  <img src="/img/marchio-600.webp" width="600" height="705" alt="Taloryn Labs">
  <div class="occhiello">Taloryn Labs</div>
  <h1>Il sito è in costruzione.</h1>
  <p>Stiamo preparando software per studi professionali: regole chiare, dati protetti. Torna a trovarci presto.</p>
  <div class="riga"></div>
  <p>Per informazioni: <a href="mailto:info@talorynlabs.it">info@talorynlabs.it</a></p>
  <small style="margin-top:22px">Questo sito non usa cookie né strumenti di tracciamento.</small>
</main>
</body>
</html>
